[package]
name = "fidel-tools-core-native"
version = "0.1.7"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
pyo3 = { version = "0.21.2", features = ["extension-module", "abi3-py38"], optional = true }

[features]
default = []
python = ["dep:pyo3"]

