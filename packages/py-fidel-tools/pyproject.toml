[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "fidel-tools"
version = "0.1.9"
description = "Python port of Fidel Tools - Amharic language preprocessing toolkit"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Fidel Tools Authors" }
]
dependencies = []

[tool.maturin]
manifest-path = "../core-native/Cargo.toml"
features = ["python"]
module-name = "fidel_tools.fidel_tools_core_native"

