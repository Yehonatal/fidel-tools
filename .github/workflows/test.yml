name: Test Workspaces

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install

    - name: Build packages
      run: pnpm build

    - name: Run tests
      run: pnpm test

    - name: Run Accuracy & Speed Benchmarks (Regression Check)
      run: node benchmark/run-all.js


    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Build and test Python bindings
      run: |
        python -m venv .venv
        .venv/bin/pip install --upgrade pip
        .venv/bin/pip install maturin pytest
        VIRTUAL_ENV=.venv .venv/bin/maturin develop
        .venv/bin/pytest
      working-directory: packages/py-fidel-tools

